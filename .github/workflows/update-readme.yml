name: Update profile README

on:
  schedule:
    - cron: "17 */6 * * *" # every 6 hours
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update-readme.mjs
      - scripts/render-brand.mjs
      - brand/social.html
      - .github/workflows/update-readme.yml

permissions:
  contents: write

concurrency:
  group: update-readme
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regenerate Projects table
        run: node scripts/update-readme.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORG: ${{ github.repository_owner }}

      - name: Render social images for new repos
        run: node scripts/render-brand.mjs --new-only
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORG: ${{ github.repository_owner }}

      - name: Commit if changed
        run: |
          # --porcelain rather than git diff, which can't see a newly rendered image.
          if [ -z "$(git status --porcelain -- profile/README.md brand/social)" ]; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add profile/README.md brand/social
          git commit -m "Update profile README and social images"
          git push
